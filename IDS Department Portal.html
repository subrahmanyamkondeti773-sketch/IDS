<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>IDS – Department Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#0b2447;--blue:#19376d;--lb:#e8f1fb;--g:#2e9e6e;--bg:#f6f9fc;--c:#fff;--t:#1b2a41;--m:#5b6b82;--b:#dbe4ef}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1626;--c:#14213a;--t:#e6edf7;--m:#9fb0c8;--b:#27395a;--lb:#1a2b4a}}
:root[data-theme=dark]{--bg:#0d1626;--c:#14213a;--t:#e6edf7;--m:#9fb0c8;--b:#27395a;--lb:#1a2b4a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.55}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;box-shadow:0 2px 8px #0003}
.w{max-width:1160px;margin:auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.lg{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--g),#5ec1ff);display:grid;place-items:center;font-weight:800;color:var(--navy)}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 11px;border-radius:7px;font-size:14px;color:#cfe0f5;transition:.2s}
nav a:hover{background:#ffffff1f;color:#fff}nav a.on{background:#fff;color:var(--navy);font-weight:600}
#sf{display:flex}#q{border:0;border-radius:7px;padding:7px 10px;width:130px;font-size:14px}
#mb{display:none;background:none;border:0;color:#fff;font-size:24px;margin-left:auto}
@media(max-width:900px){#mb{display:block}nav{display:none;position:absolute;top:62px;left:0;right:0;background:var(--navy);flex-direction:column;padding:10px 18px}nav.open{display:flex}.bar{position:relative}#sf{display:none}}
.hero{background:linear-gradient(120deg,#0b2447e6,#19376dcc),repeating-linear-gradient(45deg,#19376d 0 14px,#0b2447 14px 28px);color:#fff;padding:70px 0}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 10px}.hero h2{font-size:clamp(16px,2.4vw,21px);font-weight:400;color:#bfe3ff;margin:0 0 14px}.hero p{max-width:680px;color:#dbe8f7}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;background:var(--g);color:#fff;transition:.2s;margin:4px 6px 4px 0}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.o{background:transparent;border-color:#fff;color:#fff}.btn.d{background:var(--blue)}.btn.r{background:#c0392b}
main section{padding:34px 0}h3.s{font-size:24px;margin:0 0 4px;color:var(--navy)}:root[data-theme=dark] h3.s{color:#fff}
@media(prefers-color-scheme:dark){h3.s{color:#fff}}
.sub{color:var(--m);margin:0 0 18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;transition:.2s;display:flex;flex-direction:column;gap:6px}
a.card:hover,.card.h:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0b24471f;border-color:var(--g)}
.ic{width:46px;height:46px;border-radius:11px;background:var(--lb);display:grid;place-items:center;font-size:24px}
.card h4{margin:4px 0 0;font-size:17px}.card p{margin:0;color:var(--m);font-size:14px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--lb);color:var(--blue)}
.s-ip{background:#d6f3e4;color:#14633f}.s-pl{background:#e3e8f0;color:#44546b}.s-ur{background:#fff0c9;color:#7a5800}.s-oh{background:#fde0dc;color:#9c2a1e}.s-co{background:#cfe9ff;color:#0b4f8a}
.note{background:#fff7dd;border:1px solid #f0d98a;color:#6b5200;padding:9px 14px;border-radius:9px;font-size:13px;margin:14px 0}
.bar2{height:8px;border-radius:9px;background:var(--lb);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--g)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{padding:9px 11px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
.crumb{color:var(--m);font-size:13px;margin-bottom:8px}.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
ul.l{margin:4px 0;padding-left:18px;color:var(--m);font-size:14px}.tag{font-size:12px;background:var(--lb);padding:2px 8px;border-radius:6px;margin:2px;display:inline-block}
.pg{background:var(--lb);padding:30px 0}.pg h1{margin:0;font-size:32px;color:var(--navy)}@media(prefers-color-scheme:dark){.pg h1{color:#fff}}
footer{background:var(--navy);color:#b9cbe3;padding:30px 0;margin-top:30px;font-size:14px}footer a{display:block;padding:2px 0}footer a:hover{color:#fff}
.fg{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:20;max-width:90%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:13px;color:var(--m);display:block}
</style></head><body>
<header><div class="w bar"><a class="logo" href="#/"><span class="lg">IDS</span><span>IDS Portal<br><small style="font-weight:400;color:#9fc3ea">Information Digital Solutions</small></span></a>
<nav id="nav"></nav><form id="sf" title="Search"><input id="q" placeholder="🔍 Search…" aria-label="Search"></form><button id="mb" aria-label="Menu">☰</button></div></header>
<main id="app"></main><div id="toast"></div>
<footer><div class="w fg"><div><b style="color:#fff">IDS Department</b><br>Pharmaceutical IT and Digital Solutions<br>Internal support: [placeholder – ext. / email]</div>
<div><b style="color:#fff">Quick links</b><a href="#/applications">Applications</a><a href="#/projects">Ongoing Projects</a><a href="#/policies">IT Policies</a><a href="#/admin">Admin (demo)</a></div>
<div>© <span id="yr"></span> IDS Department. Internal use only.<br>Demo build – no internal systems are connected.</div></div></footer>
<script>
// ===== CONFIG: replace '' with real internal URLs when available =====
const CFG={ticket:'',track:'',kb:'',policies:'',security:'',incident:'',training:'',sapSupport:'',sapDocs:'',sapTraining:'',sop:'',valdocs:'',templates:'',procedures:''};
const STAT=['Planned','In Progress','Under Review','On Hold','Completed'],SC={'Planned':'pl','In Progress':'ip','Under Review':'ur','On Hold':'oh','Completed':'co'};
const PH='[Placeholder – to be assigned]';
const sm=(n,e)=>({start:'[Sample] TBD',end:'[Sample] TBD',owner:PH,support:'[Placeholder – support contact]',docs:'[Placeholder – training / documentation link]',policies:'[Placeholder – related SOP / policy]',issues:'No announcements (sample).',update:'[Sample update – replace with real update]',miles:['[Sample] Requirements','[Sample] Configuration','[Sample] Validation','[Sample] Go-live']});
let APPS=[
{id:'sap',name:'SAP',icon:'🏭',cat:'Enterprise Resource Planning (ERP)',dept:'Operations / Finance / Supply Chain',project:'SAP Implementation / Enhancement',status:'In Progress',progress:40,desc:'Supports integrated business processes such as procurement, inventory, finance, production, and quality management, depending on the modules deployed.',purpose:'Integrate core business processes on a single data foundation.',features:['Business process integration','Master data management','Reporting','Transaction processing'],supports:['Procurement','Manufacturing','Finance','Quality','Supply Chain'],...sm()},
{id:'mastercontrol',name:'MasterControl',icon:'📋',cat:'Quality Management System (QMS)',dept:'Quality Assurance',project:'MasterControl',status:'Under Review',progress:65,desc:'A quality management platform used to support applicable quality processes in regulated industries.',purpose:'Support controlled, compliant quality processes.',features:['Document management','Training management','Quality events','CAPA','Change control'],supports:['Quality Assurance','Manufacturing','Regulatory','Training'],...sm()},
{id:'minitab',name:'Minitab',icon:'📊',cat:'Statistical Analysis and Quality Improvement',dept:'Quality / Manufacturing / R&D',project:'Minitab',status:'Planned',progress:10,desc:'Statistical analysis software used to analyze data, understand process variation, and support quality improvement initiatives.',purpose:'Enable data-driven process understanding and improvement.',features:['Statistical analysis','Process capability','Control charts','Hypothesis testing','Process improvement'],supports:['Quality Control','Manufacturing','Research','Process Excellence'],...sm()},
{id:'lims',name:'LIMS',icon:'🧪',cat:'Laboratory Information Management System',dept:'Quality Control Laboratory',project:'LIMS',status:'In Progress',progress:25,desc:'A laboratory information system used to manage laboratory workflows, samples, testing activities, and associated results, depending on the implemented system.',purpose:'Manage laboratory workflows and results in a controlled way.',features:['Sample management','Test tracking','Laboratory workflows','Results management','Reporting'],supports:['QC Laboratory','Quality Assurance','Research'],...sm()}];
let ANN=['[Sample announcement] Replace with a real IDS announcement.'];
const DEPTS=[
{id:'service-desk',name:'Service Desk',icon:'🎧',desc:'IT support, incident and request handling for all employees.',
 btn:[['Raise a Ticket','ticket'],['View Knowledge Base','kb'],['Track Ticket','track']],demo:'Ticketing is not connected. Buttons are demonstration placeholders – no real ticket can be created or tracked here.',
 topics:['Incident Management|Restore normal service quickly after an interruption.','Service Request Management|Standard requests such as access, software and equipment.','Problem Management|Find and remove root causes of recurring incidents.','Change Management|Assess and approve changes to IT services.','IT Asset Support|Lifecycle support for IT hardware and software assets.','Laptop & Desktop Support|Setup, repair and replacement.','Software Installation & Troubleshooting|Approved software deployment and fixes.','Account Access & Password Support|Account unlocks, resets and access requests.','Network & Connectivity Support|Wired, Wi-Fi and VPN help.','Knowledge Base|Self-help articles and how-to guides.']},
{id:'csv',name:'CSV – Computerized System Validation',icon:'✅',desc:'Compliance of GxP computerized systems across their lifecycle.',
 btn:[['Approved SOPs','sop'],['Validation Documents','valdocs'],['Templates','templates'],['Internal Procedures','procedures']],demo:'Document links are placeholders. Nothing shown here is an approved company document or template.',
 topics:['Introduction to CSV|Documented evidence that a computerized system does what it is intended to do, consistently.','Purpose|Protect patient safety, product quality and data integrity.','GxP Systems Overview|Systems that support GMP, GLP, GCP or GDP-regulated activities.','GAMP 5 Principles|Risk-based, scalable, lifecycle approach with supplier leverage.','User Requirements Specification (URS)|Defines what users need the system to do.','Functional & Design Specifications|Describe how the system meets the URS.','Risk Assessment|Focus effort on functions affecting patient safety and data integrity.','Installation Qualification (IQ)|Verifies correct installation and configuration.','Operational Qualification (OQ)|Verifies functions operate as specified.','Performance Qualification (PQ)|Verifies performance in the real operating environment.','Requirements Traceability Matrix (RTM)|Links requirements to specifications and tests.','Validation Summary Report|Concludes the validation and states fitness for use.','Change Control|Evaluates changes to keep the validated state.','Periodic Review|Confirms systems remain compliant and fit for use.','Audit Trail & Data Integrity|Secure, time-stamped records following ALCOA+ principles.','Electronic Records & Signatures|Controls for trustworthy e-records and e-signatures (e.g. 21 CFR Part 11, EU Annex 11).'],
 extra:['CSV supports…','🩺 Patient Safety|Reliable systems reduce the risk of defective product reaching patients.','💊 Product Quality|Validated systems produce consistent, trustworthy results.','🔒 Data Integrity|Controls keep data attributable, legible, contemporaneous, original and accurate.','📜 Regulatory Compliance|Documented evidence supports inspections and audits.']},
{id:'cybersecurity',name:'Cybersecurity',icon:'🛡️',desc:'Protecting information, systems and people across the organization.',
 btn:[['Report a Security Incident','incident','r'],['Security Policies','security'],['Awareness Training','training']],demo:'Reporting destination is not configured. General guidance only – no confidential infrastructure details are shown.',
 topics:['Cybersecurity Overview|Keeping information confidential, accurate and available.','Information Security Policies|Rules that govern acceptable and secure use of information.','Password Security|Long, unique passphrases; never share or reuse.','Multi-Factor Authentication (MFA)|A second factor blocks most account takeovers.','Phishing Awareness|Check sender, links and urgency before you click.','Email Security|Verify attachments; report suspicious messages.','Data Protection|Handle data according to its classification.','Endpoint Security|Keep devices updated, locked and encrypted.','Network Security|Use approved networks and VPN; avoid unknown Wi-Fi.','Access Control|Least-privilege access, reviewed regularly.','Incident Reporting|Report quickly – early reporting limits impact.','Safe Internet Usage|Avoid unapproved downloads and unknown sites.','Security Awareness Training|Regular training keeps everyone alert.'],
 extra:['Practical safety tips','🔑 Lock your screen|Press Win+L / Ctrl+Cmd+Q when you step away.','🎣 Pause before clicking|Urgent requests for credentials or payments are red flags.','📎 Think before attaching|Share only what is needed, with the right people.','🚨 When in doubt, report|No report is too small.']},
{id:'sap',name:'SAP',icon:'🧩',desc:'Support, access, master data and change management for SAP.',
 btn:[['SAP Support','sapSupport'],['SAP Documentation','sapDocs'],['SAP Training','sapTraining']],demo:'SAP links are configurable placeholders. Modules below are examples – customize to the actual SAP landscape.',
 topics:['Introduction to SAP|Enterprise software integrating core business processes.','SAP in Pharma Operations|Supports procurement, batch-related production, quality, distribution and finance.','Application Support|Day-to-day support for SAP users and processes.','User Access Management|Role-based access requests, reviews and removals.','Incident Management|Log, triage and resolve SAP issues.','Master Data Support|Materials, vendors, customers and BOM data quality.','Integration Overview|Interfaces connecting SAP with other business systems.','Change Management|Controlled, documented changes to SAP.','System Maintenance|Patching, upgrades and housekeeping windows.','Training & Documentation|User guides and role-based training.'],
 extra:['SAP modules (examples)','MM – Materials Management|Procurement and inventory.','SD – Sales and Distribution|Orders, delivery and billing.','PP – Production Planning|Planning and production orders.','QM – Quality Management|Inspections and quality notifications.','FI – Financial Accounting|General ledger, payables, receivables.','PM – Plant Maintenance|Equipment maintenance and calibration.']}];
const PAGES=[['','Home'],['about','About IDS'],['departments','Departments'],['applications','Applications'],['projects','Ongoing Projects'],['policies','IT Policies'],['contact','Contact']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('ids-demo',JSON.stringify({APPS,ANN}))}catch(e){}};
try{const d=JSON.parse(localStorage.getItem('ids-demo')||'null');if(d){APPS=d.APPS;ANN=d.ANN}}catch(e){}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3200)};
const link=(label,key,cls='')=>CFG[key]?`<a class="btn ${cls||'d'}" href="${esc(CFG[key])}" target="_blank" rel="noopener">${label}</a>`:`<a class="btn ${cls||'d'}" href="#" data-ph="${label}">${label} <small>(not connected)</small></a>`;
const bdg=s=>`<span class="bd s-${SC[s]}">${esc(s)}</span>`;
const note=t=>`<div class="note">⚠️ ${t}</div>`;
const SAMPLE=note('<b>Sample data.</b> Owners, dates, statuses and progress are demonstration placeholders – not verified company information.');
const head=(t,s,c)=>`<div class="pg"><div class="w">${c?`<div class="crumb">${c}</div>`:''}<h1>${t}</h1><p class="sub" style="margin:6px 0 0">${s||''}</p></div></div>`;
const deptCard=d=>`<a class="card h" href="#/departments/${d.id}"><div class="ic">${d.icon}</div><h4>${d.name}</h4><p>${d.desc}</p><span style="color:var(--g);font-weight:600;font-size:14px">Explore More →</span></a>`;
const appCard=(a,big)=>`<div class="card h"><div class="row"><div class="ic">${a.icon}</div><div><h4 style="margin:0">${esc(a.name)}</h4><span class="tag">${esc(a.cat)}</span></div></div>${bdg(a.status)}<p>${esc(a.desc)}</p><p><b>Purpose:</b> ${esc(a.purpose)}</p>${big?`<div>${a.features.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</div><p><b>Owner:</b> ${esc(a.owner)}</p>`:''}<div><a class="btn d" href="#/applications/${a.id}">View ${esc(a.name)} Details</a></div></div>`;
const projCard=a=>`<div class="card h"><div class="row"><div class="ic">${a.icon}</div><h4 style="margin:0">${esc(a.project)}</h4></div><div class="row">${bdg(a.status)}<span class="tag">${esc(a.cat.split('(')[0])}</span></div><p>${esc(a.desc)}</p><div class="bar2"><i style="width:${+a.progress}%"></i></div><small>${+a.progress}% <i>(sample)</i></small><p><b>Owner:</b> ${esc(a.owner)} · <b>Dept:</b> ${esc(a.dept)}</p><p><b>Dates:</b> ${esc(a.start)} → ${esc(a.end)}</p><p><b>Latest:</b> ${esc(a.update)}</p><ul class="l">${a.miles.map(m=>`<li>${esc(m)}</li>`).join('')}</ul><div><a class="btn d" href="#/applications/${a.id}">View Details</a></div></div>`;
const R={};
R['']=()=>`<div class="hero"><div class="w"><h1>Information Digital Solutions (IDS)</h1><h2>Enabling Digital Transformation, Operational Excellence, and Secure Technology Across Pharmaceutical Operations.</h2><p>The Information Digital Solutions department supports the organization's digital ecosystem by managing IT services, ensuring computer system compliance, strengthening cybersecurity, supporting enterprise applications, and enabling data-driven decision-making.</p><a class="btn" href="#/departments">Explore Departments</a><a class="btn o" href="#/projects">View Ongoing Projects</a></div></div>
<div class="w">${ANN.length?`<div class="note" style="background:var(--lb);border-color:var(--b);color:var(--t)">📢 <b>Announcements:</b> ${ANN.map(esc).join(' · ')}</div>`:''}
<section><h3 class="s">About IDS</h3><p class="sub">IDS enables the business to operate digitally, compliantly and securely.</p><div class="grid">${[['🎧','IT Service Management','Employee support and service delivery.'],['✅','Computerized System Validation','GxP compliance of computerized systems.'],['🛡️','Cybersecurity','Information protection and awareness.'],['🧰','Enterprise Applications','Lifecycle management of business systems.'],['🧩','SAP & Business Apps','Support for ERP and business applications.'],['🚀','Digital Transformation','Efficiency through data and automation.']].map(x=>`<div class="card"><div class="ic">${x[0]}</div><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div></section>
<section><h3 class="s">Departments</h3><p class="sub">Five IDS sub-departments.</p><div class="grid">${DEPTS.map(deptCard).join('')}<a class="card h" href="#/applications"><div class="ic">🗂️</div><h4>Applications</h4><p>Business applications managed by IDS.</p><span style="color:var(--g);font-weight:600;font-size:14px">Explore More →</span></a></div></section>
<section><h3 class="s">Ongoing Projects</h3><p class="sub">Statuses are configurable – not every project is assumed active.</p>${SAMPLE}<div class="grid">${APPS.map(a=>`<div class="card h"><div class="row"><div class="ic">${a.icon}</div><h4 style="margin:0">${esc(a.project)}</h4></div>${bdg(a.status)}<p>${esc(a.desc)}</p><p><b>Business purpose:</b> ${esc(a.purpose)}</p><div><a class="btn d" href="#/applications/${a.id}">View Details</a></div></div>`).join('')}</div></section>
<section><h3 class="s">Quick Access</h3><p class="sub">Links are configurable (see CFG in source/README).</p><div class="grid">${[['🎫','Raise an IT Ticket','ticket'],['📜','IT Policies','policies'],['📚','Knowledge Base','kb'],['🗂️','Applications','#/applications'],['🛡️','Cybersecurity Awareness','#/departments/cybersecurity'],['📈','Ongoing Projects','#/projects']].map(q=>q[2][0]=='#'?`<a class="card h" href="${q[2]}"><div class="ic">${q[0]}</div><h4>${q[1]}</h4></a>`:`<a class="card h" href="${CFG[q[2]]||'#'}" ${CFG[q[2]]?'target="_blank" rel="noopener"':`data-ph="${q[1]}"`}><div class="ic">${q[0]}</div><h4>${q[1]}</h4>${CFG[q[2]]?'':'<small>Not connected</small>'}</a>`).join('')}</div></section></div>`;
R.about=()=>head('About IDS','Department overview, mission and governance')+`<div class="w"><section><div class="two"><div class="card"><h4>🎯 Vision</h4><p>A digitally enabled, compliant and secure pharmaceutical organization. <i>(Sample wording)</i></p></div><div class="card"><h4>🧭 Mission</h4><p>Deliver reliable IT services, validated systems and secure technology that protect patients and support the business. <i>(Sample wording)</i></p></div></div></section>
<section><h3 class="s">Key Responsibilities</h3><div class="grid">${['IT service management & employee support|🎧','Computerized System Validation|✅','Cybersecurity & information protection|🛡️','Enterprise application management|🗂️','SAP & business application support|🧩','Digital transformation & efficiency|🚀'].map(x=>x.split('|')).map(x=>`<div class="card"><div class="ic">${x[1]}</div><h4>${x[0]}</h4></div>`).join('')}</div></section>
<section><h3 class="s">Role, Governance & Collaboration</h3><div class="grid">${[['💊 Role in pharma operations','Systems underpin manufacturing, laboratories, quality and supply chain.'],['🚀 Digital transformation','Modernizing applications, automating workflows and improving data use.'],['⚖️ IT governance & compliance','Policies, change control and validation keep systems compliant.'],['🤝 Quality Assurance','Joint ownership of validation and data integrity.'],['🏭 Manufacturing','Support for production and shop-floor systems.'],['🔬 Research & other departments','Tools and analytics for R&D, finance and commercial teams.']].map(x=>`<div class="card"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div></section></div>`;
R.departments=()=>head('Departments','IDS sub-departments')+`<div class="w"><section><div class="grid">${DEPTS.map(deptCard).join('')}</div></section></div>`;
R.dept=id=>{const d=DEPTS.find(x=>x.id==id);if(!d)return R.nf();const T=d.topics.map(t=>t.split('|'));return head(d.icon+' '+d.name,d.desc,'<a href="#/departments">Departments</a> › '+d.name)+`<div class="w">${note(d.demo)}<div>${d.btn.map(b=>link(b[0],b[1],b[2])).join('')}</div><section><div class="grid">${T.map(t=>`<div class="card"><h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('')}</div></section>${d.extra?`<section><h3 class="s">${d.extra[0]}</h3><div class="grid">${d.extra.slice(1).map(e=>{const p=e.split('|');return`<div class="card"><h4>${p[0]}</h4><p>${p[1]}</p></div>`}).join('')}</div></section>`:''}${d.id=='sap'?`<section><h3 class="s">Related applications</h3><div class="grid">${appCard(APPS[0])}</div></section>`:''}</div>`};
R.applications=()=>head('Applications','Business applications and projects managed by IDS')+`<div class="w"><section>${SAMPLE}<div class="tb"><input id="fq" placeholder="Search applications…"><select id="fc"><option value="">All categories</option>${APPS.map(a=>`<option>${esc(a.cat)}</option>`).join('')}</select></div><div class="grid" id="fl" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))"></div></section></div>`;
R.projects=()=>head('Ongoing Projects','Project dashboard')+`<div class="w"><section>${SAMPLE}<div class="tb"><input id="fq" placeholder="Search projects…"><select id="fs"><option value="">All statuses</option>${STAT.map(s=>`<option>${s}</option>`).join('')}</select><select id="fc"><option value="">All categories</option>${APPS.map(a=>`<option>${esc(a.cat)}</option>`).join('')}</select></div><div class="grid" id="fl" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))"></div></section></div>`;
R.app=id=>{const a=APPS.find(x=>x.id==id);if(!a)return R.nf();const c=(t,b)=>`<div class="card"><h4>${t}</h4>${b}</div>`;return head(a.icon+' '+esc(a.name),esc(a.cat),'<a href="#/applications">Applications</a> › '+esc(a.name))+`<div class="w"><section>${note('Placeholder information for demonstration – not verified company data. External systems are not connected.')}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${c('1. Overview',`<p>${esc(a.desc)}</p>`)+c('2. Business Purpose',`<p>${esc(a.purpose)}</p>`)+c('3. Key Features','<ul class="l">'+a.features.map(f=>`<li>${esc(f)}</li>`).join('')+'</ul>')+c('4. Departments Supported',a.supports.map(s=>`<span class="tag">${esc(s)}</span>`).join(''))+c('5. Project Status',`${bdg(a.status)}<div class="bar2"><i style="width:${+a.progress}%"></i></div><small>${+a.progress}% (sample) · ${esc(a.start)} → ${esc(a.end)}</small><p>${esc(a.update)}</p>`)+c('6. Project Owner',`<p>${esc(a.owner)}</p>`)+c('7. Support Contact',`<p>${esc(a.support)}</p>`)+c('8. Training & Documentation',`<p>${esc(a.docs)}</p>`)+c('9. Related Policies / Procedures',`<p>${esc(a.policies)}</p>`)+c('10. Known Issues / Announcements',`<p>${esc(a.issues)}</p>`)}</div><p style="margin-top:18px"><b>Related:</b> ${APPS.filter(x=>x.id!=a.id).map(x=>`<a class="tag" href="#/applications/${x.id}">${x.icon} ${esc(x.name)}</a>`).join('')} <a class="tag" href="#/projects">All projects</a></p></section></div>`};
R.policies=()=>head('IT Policies','Policy library')+`<div class="w"><section>${note('Policy documents are not connected. Configure CFG.policies to link your document system.')}<div>${link('Open Policy Library','policies')}${link('Cybersecurity Policies','security')}</div></section></div>`;
R.contact=()=>head('Contact','Reach IDS')+`<div class="w"><section>${note('Placeholder contacts – replace with verified details.')}<div class="two"><div class="card"><h4>🎧 Service Desk</h4><p>[placeholder – phone / email / extension]</p></div><div class="card"><h4>🛡️ Security Incidents</h4><p>[placeholder – reporting destination]</p></div></div></section></div>`;
R.search=q=>{q=decodeURIComponent(q||'').toLowerCase();const h=(...s)=>s.join(' ').toLowerCase().includes(q);return head('Search results','“'+esc(q)+'”')+`<div class="w"><section><div class="grid">${DEPTS.filter(d=>h(d.name,d.desc,d.topics.join())).map(deptCard).join('')}${APPS.filter(a=>h(a.name,a.desc,a.cat,a.project)).map(a=>appCard(a)).join('')||''}</div></section></div>`};
R.nf=()=>head('Page not found','')+`<div class="w"><section><a class="btn" href="#/">Back to Home</a></section></div>`;
R.admin=()=>{const sel=(o,v)=>o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');return head('Admin Dashboard (Demo)','Manage applications, projects and announcements')+`<div class="w"><section>${note('<b>Demo mode.</b> No authentication or database is configured, so anyone opening this page can edit. Changes live only in this browser. A production build must use server-side authentication, role-based authorization (admin vs read-only employee) and persistent storage.')}
<div class="card" style="margin-bottom:16px"><h4>📢 Publish announcement</h4><form id="af" class="row"><input name="t" required maxlength="160" placeholder="Announcement text" style="flex:1;min-width:220px"><button class="btn">Publish</button></form><ul class="l">${ANN.map((x,i)=>`<li>${esc(x)} <a href="#" data-del="${i}">remove</a></li>`).join('')}</ul></div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${APPS.map((a,i)=>`<form class="card ef" data-i="${i}"><h4>${a.icon} ${esc(a.name)}</h4>${[['owner','Project owner'],['support','Support contact'],['docs','Training / documentation link'],['update','Latest update'],['start','Start date'],['end','Expected completion']].map(f=>`<label>${f[1]}<input name="${f[0]}" value="${esc(a[f[0]])}" maxlength="200" style="width:100%"></label>`).join('')}<label>Status<select name="status" style="width:100%">${sel(STAT,a.status)}</select></label><label>Progress % <input type="number" name="progress" min="0" max="100" value="${+a.progress}" required style="width:100%"></label><label>Add milestone<input name="ms" maxlength="120" style="width:100%"></label><button class="btn d">Save</button></form>`).join('')}</div>
<div class="card" style="margin-top:16px"><h4>➕ Add application</h4><form id="nf" class="row"><input name="n" required maxlength="60" placeholder="Name"><input name="c" required maxlength="80" placeholder="Category"><button class="btn">Add</button></form></div></section></div>`};
function filt(proj){const q=($('#fq').value||'').toLowerCase(),s=$('#fs')?$('#fs').value:'',c=$('#fc').value;const L=APPS.filter(a=>(!q||(a.name+a.desc+a.project+a.cat).toLowerCase().includes(q))&&(!s||a.status==s)&&(!c||a.cat==c));$('#fl').innerHTML=L.map(a=>proj?projCard(a):appCard(a,1)).join('')||'<p class="sub">No matches.</p>'}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/'),k=p[0];let h;
 if(k=='departments'&&p[1])h=R.dept(p[1]);else if(k=='applications'&&p[1])h=R.app(p[1]);else if(k=='search')h=R.search(p[1]);else h=(R[k]||R.nf)();
 $('#app').innerHTML=h;scrollTo(0,0);$('#nav').classList.remove('open');
 $('#nav').innerHTML=PAGES.map(x=>`<a href="#/${x[0]}" class="${(k||'')==x[0]||(k=='app'&&0)?'on':''}">${x[1]}</a>`).join('');
 if(k=='applications'&&!p[1]||k=='projects'){const pr=k=='projects';filt(pr);['fq','fs','fc'].forEach(i=>{const e=$('#'+i);e&&e.addEventListener('input',()=>filt(pr))})}
 if(k=='admin')wireAdmin()}
function wireAdmin(){$('#af').onsubmit=e=>{e.preventDefault();ANN.push(e.target.t.value.trim());save();route();toast('Announcement published (demo)')};
 document.querySelectorAll('[data-del]').forEach(a=>a.onclick=e=>{e.preventDefault();ANN.splice(+a.dataset.del,1);save();route()});
 document.querySelectorAll('.ef').forEach(f=>f.onsubmit=e=>{e.preventDefault();const a=APPS[+f.dataset.i],d=new FormData(f);const pr=Math.min(100,Math.max(0,+d.get('progress')));if(isNaN(pr))return;['owner','support','docs','update','start','end','status'].forEach(k=>a[k]=d.get(k));a.progress=pr;const m=(d.get('ms')||'').trim();if(m)a.miles.push(m);save();route();toast(a.name+' updated (demo)')});
 $('#nf').onsubmit=e=>{e.preventDefault();const f=e.target;APPS.push({id:'app'+Date.now(),name:f.n.value.trim(),icon:'🆕',cat:f.c.value.trim(),dept:PH,project:f.n.value.trim(),status:'Planned',progress:0,desc:'[Sample description]',purpose:'[Sample purpose]',features:['[Sample feature]'],supports:[PH],...sm()});save();route();toast('Application added (demo)')}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ph]');if(a){e.preventDefault();toast('“'+a.dataset.ph+'” – external system not connected yet. Set the URL in CFG.')}});
$('#sf').onsubmit=e=>{e.preventDefault();const v=$('#q').value.trim();if(v)location.hash='#/search/'+encodeURIComponent(v)};
$('#mb').onclick=()=>$('#nav').classList.toggle('open');$('#yr').textContent=new Date().getFullYear();
addEventListener('hashchange',route);route();
</script></body></html>
